    * {

      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      width: 100%;
      height: 100%;
      background-color: #18181c;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      font-family: "Courier New", Courier, monospace;
    }
    #app-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }
    canvas {
      display: block;
      image-rendering: pixelated;
      box-shadow: 0 0 24px rgba(0, 0, 0, 0.8);
      background: #5c94fc;
      touch-action: manipulation;
    }
    #mobile-input-overlay {
      position: fixed;
      left: -9999px;
      top: 0;
      opacity: 0.01;
      color: transparent;
      background: transparent;
      border: none;
      outline: none;
      caret-color: transparent;
      font-size: 16px;
      z-index: 20;
      user-select: text;
      -webkit-user-select: text;
    }
  </style>

    let audioCtx = null;
    function ensureAudio() {
      if (!audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (AudioContext) audioCtx = new AudioContext();
      }
      if (audioCtx && audioCtx.state === "suspended") {
        audioCtx.resume();
      }
    }

    function play8Bit(freqs, durationMs = 65, volume = 0.08) {
      try {
        ensureAudio();
        if (!audioCtx) return;
        let now = audioCtx.currentTime;
        freqs.forEach((f) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = "square";
          osc.frequency.setValueAtTime(f, now);
          gain.gain.setValueAtTime(volume, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + durationMs / 1000);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now);
          osc.stop(now + durationMs / 1000);
          now += durationMs / 1000;
        });
      } catch (e) {}
    }

    function saveHighscore(name, score, wpm, difficulty, lang, mode) {
      const scores = loadHighscores();
      scores.push({
        name: name && name.trim() ? name.trim() : "PLAYER1",
        score,
        wpm,
        difficulty,
        lang,
        mode
      });
      scores.sort((a, b) => b.score - a.score);
      localStorage.setItem(LS_SCORES, JSON.stringify(scores.slice(0, 5)));
    }

    function loadProgress() {
      const def = {
        easy_words: 0,
        medium_words: 0,
        hard_words: 0,
        best_hard_wpm: 0,
        completed_missions: []
      };
      try {
        const raw = localStorage.getItem(LS_PROGRESS);
        if (!raw) return def;
        return { ...def, ...JSON.parse(raw) };
      } catch (e) {
        return def;
      }
    }

    function saveProgress(prog) {
      try {
        localStorage.setItem(LS_PROGRESS, JSON.stringify(prog));
      } catch (e) {}
    }

    function evaluateMissionsAndSkills(prog) {
      const completed = new Set(prog.completed_missions || []);
      const newly = [];
      for (const m of MISSIONS_DATA) {
        if (!completed.has(m.id) && (prog[m.stat] || 0) >= m.target) {
          completed.add(m.id);
          newly.push(m);
        }
      }
      prog.completed_missions = Array.from(completed).sort((a, b) => a - b);
      if (newly.length > 0) saveProgress(prog);

      const unlocked = {
        F1: completed.has(1),
        F2: completed.has(2),
        F3: completed.has(3),
        F4: completed.has(4)
      };

      let cdF1 = 15 - (completed.has(5) ? 3 : 0) - (completed.has(9) ? 5 : 0);
      let cdF2 = 20 - (completed.has(6) ? 5 : 0) - (completed.has(10) ? 5 : 0);
      let cdF3 = 30 - (completed.has(7) ? 5 : 0) - (completed.has(11) ? 10 : 0);
      let cdF4 = 60 - (completed.has(8) ? 10 : 0) - (completed.has(12) ? 20 : 0);

      return {
        unlocked,
        cooldownsMs: {
          F1: Math.max(1, cdF1) * 1000,
          F2: Math.max(1, cdF2) * 1000,
          F3: Math.max(1, cdF3) * 1000,
          F4: Math.max(1, cdF4) * 1000
        },
        newly
      };
    }

    function drawTextOutline(text, font, color, x, y, thickness = 2, center = false, outlineColor = COLORS.BLACK) {
      ctx.font = font;
      ctx.textBaseline = "top";
      const w = ctx.measureText(text).width;
      const drawX = center ? x - w / 2 : x;
      ctx.fillStyle = outlineColor;
      for (let dx = -thickness; dx <= thickness; dx++) {
        for (let dy = -thickness; dy <= thickness; dy++) {
          if (dx !== 0 || dy !== 0) {
            ctx.fillText(text, drawX + dx, y + dy);
          }
        }
      }
      ctx.fillStyle = color;
      ctx.fillText(text, drawX, y);
      return w;
    }

    function drawRectBox(x, y, w, h, bg, border = COLORS.BLACK, lineW = 3, topShine = null) {
      ctx.fillStyle = bg;
      ctx.fillRect(x, y, w, h);
      if (topShine) {
        ctx.fillStyle = topShine;
        ctx.fillRect(x + 3, y + 3, w - 6, 4);
      }
      if (border) {
        ctx.strokeStyle = border;
        ctx.lineWidth = lineW;
        ctx.strokeRect(x, y, w, h);
      }
    }

    function drawButton(rect, text, bgColor, font = "bold 17px 'Courier New'") {
      drawRectBox(rect.x, rect.y, rect.w, rect.h, bgColor, COLORS.BLACK, 3, COLORS.QBLOCK_SHINE);
      const fontSize = parseInt(font.match(/\d+/)[0], 10);
      drawTextOutline(text, font, COLORS.TEXT_WHITE, rect.x + rect.w / 2, rect.y + (rect.h - fontSize) / 2, 2, true);
    }

    function drawStoneBox(x, y, w, h) {
      ctx.fillStyle = COLORS.STONE_DARK;
      ctx.fillRect(x, y, w, h);
      ctx.strokeStyle = COLORS.STONE_LIGHT;
      ctx.lineWidth = 4;
      ctx.strokeRect(x, y, w, h);
      ctx.strokeStyle = COLORS.BLACK;
      ctx.lineWidth = 2;
      ctx.strokeRect(x, y, w, h);
    }

    function drawBackground() {
      ctx.fillStyle = COLORS.SKY_BLUE;
      ctx.fillRect(0, 0, WIDTH, HEIGHT);
      const groundY = HEIGHT - 84;

      function drawHill(cx, baseY, w, h) {
        ctx.beginPath();
        ctx.moveTo(cx - w / 2, baseY);
        ctx.lineTo(cx, baseY - h);
        ctx.lineTo(cx + w / 2, baseY);
        ctx.closePath();
        ctx.fillStyle = COLORS.HILL_GREEN;
        ctx.fill();
        ctx.strokeStyle = COLORS.BLACK;
        ctx.lineWidth = 3;
        ctx.stroke();
        ctx.fillStyle = COLORS.HILL_DARK;

    function drawLightningArc(p1, p2) {
      const [x1, y1] = p1;
      const [x2, y2] = p2;
      const segs = 6;
      const pts = [[x1, y1]];
      for (let i = 1; i < segs; i++) {
        const t = i / segs;
        pts.push([
          x1 + (x2 - x1) * t + (Math.random() * 26 - 13),
          y1 + (y2 - y1) * t + (Math.random() * 26 - 13)
        ]);
      }
      pts.push([x2, y2]);

      ctx.strokeStyle = COLORS.ICE_CYAN;
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.moveTo(pts[0][0], pts[0][1]);
      for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
      ctx.stroke();

      ctx.strokeStyle = COLORS.THUNDER_YELLOW;
      ctx.lineWidth = 2.5;
      ctx.stroke();

      ctx.fillStyle = COLORS.THUNDER_YELLOW;
      ctx.beginPath();
      ctx.arc(x2, y2, 6, 0, Math.PI * 2);
      ctx.fill();
    }

        mobileInput.style.left = `${rect.left + targetRect.x * scale}px`;

    function updateViewportMetrics() {
      const vv = window.visualViewport;
      const vw = vv ? vv.width : window.innerWidth;
      const vh = vv ? vv.height : window.innerHeight;
      const fullH = Math.max(window.innerHeight, document.documentElement.clientHeight);

      const scale = Math.min(vw / WIDTH, fullH / HEIGHT);
      canvas.style.width = `${Math.floor(WIDTH * scale)}px`;
      canvas.style.height = `${Math.floor(HEIGHT * scale)}px`;

      const rect = canvas.getBoundingClientRect();
      const currentScale = rect.width > 0 ? rect.width / WIDTH : scale;
      const topOffset = rect.top || 0;
      const visiblePx = Math.max(240, vh - topOffset);
      visibleCanvasBottom = Math.min(HEIGHT, Math.floor(visiblePx / currentScale));
      isKeyboardOpen = vh < fullH * 0.82;

      syncInputOverlayPosition();
    }

    function spawnWord(text, speed, isPhrase = false) {
      const upper = text.toUpperCase();
      const font = isPhrase ? "bold 18px 'Courier New'" : "bold 21px 'Courier New'";
      ctx.font = font;
      const w = ctx.measureText(upper).width;
      const maxX = Math.max(24, WIDTH - w - 24);
      let x = isPhrase ? (WIDTH - w) / 2 : 24 + Math.random() * (maxX - 24);

      if (!isPhrase) {
        for (let attempt = 0; attempt < 30; attempt++) {
          const cand = 24 + Math.random() * (maxX - 24);
          let overlap = false;
          for (const ew of activeWords) {
            if (ew.y < 195 && Math.abs(cand - ew.x) < Math.max(w, ew.width) + 22) {
              overlap = true;
              break;
            }
          }
          if (!overlap) {
            x = cand;
            break;
          }
        }
      }

      activeWords.push({
        text: upper,
        typed: "",
        speed,
        isPhrase,
        font,
        width: w,
        x,
        y: 78
      });
    }

    function pickBalancedWord(list) {
      const initials = new Set(activeWords.map((w) => w.text[0]));
      const unique = list.filter((w) => !initials.has(w[0].toUpperCase()));
      const pool = unique.length > 0 ? unique : list;
      return pool[Math.floor(Math.random() * pool.length)];
    }

    function getThunderTargets(source, maxTargets = 3) {
      if (!source) return [];
      const sx = source.x + source.width / 2;
      const sy = source.y + 14;
      const others = activeWords.filter((w) => w !== source);
      others.sort((a, b) => {
        const da = Math.hypot(a.x + a.width / 2 - sx, a.y + 14 - sy);
        const db = Math.hypot(b.x + b.width / 2 - sx, b.y + 14 - sy);
        return da - db;
      });
      return others.slice(0, maxTargets);
    }

    function handleCharacterInput(rawChar) {
      const nowTicks = performance.now();
      if (state === "SETUP") {
        if (/[a-zA-Z0-9]/.test(rawChar) && playerName.length < 10) {
          playerName += rawChar.toUpperCase();
          sfxType();
        }
        return;
      }
      if (state !== "PLAYING") return;
      if (!/[a-zA-Z ]/.test(rawChar)) return;

      const char = rawChar.toUpperCase();
      totalKeystrokes++;
      lastKeystrokeTicks = nowTicks;

      if (!lockedWord) {
        if (char !== " ") {
          const cands = activeWords.filter((w) => w.text.startsWith(char));
          if (cands.length > 0) {
            lockedWord = cands.reduce((a, b) => (a.y > b.y ? a : b));
            lockedWord.typed += char;
            totalCharsTyped++;
            mistypedState = false;
            sfxType();
          } else {
            combo = 0;
            flashError = 5;
            sfxError();
            triggerRoast("mistype", nowTicks);
          }
        }
      } else {
        const idx = lockedWord.typed.length;
        const expected = idx < lockedWord.text.length ? lockedWord.text[idx] : null;
        if (expected === char) {
          lockedWord.typed += char;
          totalCharsTyped++;
          mistypedState = false;
          sfxType();
        } else if (mistypedState && char !== " ") {
          const others = activeWords.filter((w) => w !== lockedWord && w.text.startsWith(char));
          if (others.length > 0) {
            lockedWord.typed = "";
            lockedWord = others.reduce((a, b) => (a.y > b.y ? a : b));
            lockedWord.typed += char;
            totalCharsTyped++;
            mistypedState = false;
            sfxType();
          } else {
            combo = 0;
            flashError = 5;
            sfxError();
            triggerRoast("mistype", nowTicks);
          }
        } else {
          mistypedState = true;
          combo = 0;
          flashError = 5;
          sfxError();
          triggerRoast("mistype", nowTicks);
        }
      }

      if (lockedWord && lockedWord.typed === lockedWord.text) {
        combo++;
        coins++;
        const bonus = Math.floor(combo / 5) * 50;
        let wordsGained = 1;
        let phraseBonus = 0;

        if (lockedWord.isPhrase) {
          wordsGained = DIFFICULTY_SETTINGS[difficulty].phrase_words_bonus;
          phraseBonus = 300;
          popups.push({
            text: `BONUS POINT! +${wordsGained}`,
            x: lockedWord.x + lockedWord.width / 2,
            y: lockedWord.y - 12,
            life: 70
          });
          sfxBonusPhrase();
        } else {
          sfxCoin();
        }

        wordsCleared += wordsGained;
        score += lockedWord.text.length * 20 + bonus + phraseBonus;

        let zapped = [];
        if (gameMode === "TYPERIA" && f3ThunderActive) {
          zapped = getThunderTargets(lockedWord, 3);
          f3ThunderActive = false;
          if (zapped.length > 0) {
            score += zapped.length * 120;
            coins += zapped.length;
            wordsCleared += zapped.length;
            wordsGained += zapped.length;
            sfxSkillThunder();
            showBanner(`THUNDER! +${zapped.length} WORDS!`, COLORS.THUNDER_YELLOW, nowTicks);
          }
        }

        activeWords = activeWords.filter((w) => w !== lockedWord && !zapped.includes(w));
        recordWordsProgress(wordsGained, nowTicks);

        const elapsedSec = Math.max((nowTicks - startTime) / 1000, 1);
        const liveWpm = Math.floor(totalCharsTyped / 5 / (elapsedSec / 60));
        if (elapsedSec >= 10) recordWpmProgress(liveWpm, nowTicks);

        if (combo >= 5 && (liveWpm >= 30 || combo % 6 === 0)) {
          triggerRoast("praise_grudging", nowTicks);
        }

        lockedWord = null;
        mistypedState = false;
      }
    }

    function cancelLockedWord() {
      if (state === "SETUP") {
        playerName = playerName.slice(0, -1);
        sfxType();
        return;
      }
      if (state === "PLAYING" && lockedWord) {
        lockedWord.typed = "";
        lockedWord = null;
        mistypedState = false;
        sfxType();
      }
    }

    mobileInput.addEventListener("input", () => {
      const val = mobileInput.value;
      if (val.length === 0) {
        cancelLockedWord();
      } else {
        const typed = val.startsWith(" ") ? val.slice(1) : val;
        for (const ch of typed) {
          handleCharacterInput(ch);
        }
      }
      mobileInput.value = " ";
      try {
        mobileInput.setSelectionRange(1, 1);
      } catch (e) {}
    });

    mobileInput.addEventListener("keydown", (e) => {
      if (e.key === "Backspace") {
        e.preventDefault();
        cancelLockedWord();
        mobileInput.value = " ";
      } else if (e.key === "Enter") {
        e.preventDefault();
        if (state === "SETUP") {
          sfxCoin();
          startGame();
        }
      }
    });

    window.addEventListener("keydown", (e) => {
      if (document.activeElement === mobileInput) return;
      if (e.key === "Escape") {
        if (state === "PLAYING") triggerPause();
        else if (state === "PAUSED") resumeGame();
        else if (["SETUP", "LEADERBOARD", "MISSIONS", "PATCHES"].includes(state)) state = "MENU";
        else if (state === "INFO") state = infoReturn;
        return;
      }
      if (e.key === "Backspace" || e.key === "Tab") {
        e.preventDefault();
        cancelLockedWord();
        return;
      }
      if (e.key === "Enter") {
        if (state === "MENU") state = "SETUP";
        else if (state === "SETUP") { sfxCoin(); startGame(); }
        else if (state === "PAUSED") resumeGame();
        else if (state === "GAMEOVER") startGame();
        return;
      }
      if (state === "PLAYING" && gameMode === "TYPERIA" && ["F1", "F2", "F3", "F4"].includes(e.key)) {
        e.preventDefault();
        activateSkill(e.key, performance.now());
        return;
      }
      if (e.key.length === 1) {
        handleCharacterInput(e.key);
      }
    });

    function getCanvasCoords(clientX, clientY) {
      const rect = canvas.getBoundingClientRect();
      return {
        x: ((clientX - rect.left) / rect.width) * WIDTH,
        y: ((clientY - rect.top) / rect.height) * HEIGHT
      };
    }

    let touchStartY = null;
    canvas.addEventListener("touchstart", (e) => {
      ensureAudio();
      if (e.touches.length > 0) {
        touchStartY = e.touches[0].clientY;
      }
    }, { passive: true });

    canvas.addEventListener("touchmove", (e) => {
      if (touchStartY === null || e.touches.length === 0) return;
      const dy = touchStartY - e.touches[0].clientY;
      touchStartY = e.touches[0].clientY;
      if (state === "PATCHES") {
        patchScrollY = Math.max(0, Math.min(maxPatchScroll, patchScrollY + dy * 1.4));
      } else if (state === "MISSIONS") {
        missionScrollY = Math.max(0, Math.min(maxMissionScroll, missionScrollY + dy * 1.4));
      }
    }, { passive: true });

    canvas.addEventListener("wheel", (e) => {
      if (state === "PATCHES") {
        patchScrollY = Math.max(0, Math.min(maxPatchScroll, patchScrollY + e.deltaY * 0.6));
      } else if (state === "MISSIONS") {
        missionScrollY = Math.max(0, Math.min(maxMissionScroll, missionScrollY + e.deltaY * 0.6));
      }
    }, { passive: true });

    function handleBoardTap(clientX, clientY, ev) {
      ensureAudio();
      const { x, y } = getCanvasCoords(clientX, clientY);
      const nowTicks = performance.now();

      if (state === "MENU") {
        if (hit(BTN.versionBadge, x, y)) {
          sfxType();
          patchScrollY = 0;
          state = "PATCHES";
        } else if (hit(BTN.menuStart, x, y)) {
          sfxType();
          state = "SETUP";
        } else if (hit(BTN.menuLb, x, y)) {
          sfxType();
          state = "LEADERBOARD";
        } else if (hit(BTN.menuInfo, x, y)) {
          sfxType();
          infoReturn = "MENU";
          state = "INFO";
        } else if (hit(BTN.menuMissions, x, y)) {
          sfxType();
          missionScrollY = 0;
          const res = evaluateMissionsAndSkills(progress);
          unlockedSkills = res.unlocked;
          skillCooldownsMs = res.cooldownsMs;
          state = "MISSIONS";
        }
      } else if (state === "PATCHES") {
        if (hit(BTN.backBottom, x, y)) {
          sfxType();
          state = "MENU";
        }
      } else if (state === "SETUP") {
        if (hit(BTN.nameBox, x, y)) {
          focusMobileKeyboard();
        } else if (hit(BTN.easy, x, y)) {
          difficulty = "EASY";
          sfxType();
        } else if (hit(BTN.med, x, y)) {
          difficulty = "MEDIUM";
          sfxType();
        } else if (hit(BTN.hard, x, y)) {
          difficulty = "HARD";
          sfxType();
        } else if (hit(BTN.langId, x, y)) {
          language = "INDONESIA";
          sfxType();
        } else if (hit(BTN.langEn, x, y)) {
          language = "ENGLISH";
          sfxType();
        } else if (hit(BTN.langPy, x, y)) {
          language = "PYTHON";
          sfxType();
        } else if (hit(BTN.modeClassic, x, y)) {
          gameMode = "CLASSIC";
          sfxType();
        } else if (hit(BTN.modeInfinite, x, y)) {
          gameMode = "INFINITE";
          sfxType();
        } else if (hit(BTN.modeTyperia, x, y)) {
          gameMode = "TYPERIA";
          sfxType();
        } else if (hit(BTN.setupPlay, x, y)) {
          if (ev) ev.preventDefault();
          sfxCoin();
          startGame();
        } else if (hit(BTN.setupBack, x, y)) {
          sfxType();
          state = "MENU";
        }
      } else if (state === "LEADERBOARD") {
        if (hit(BTN.backBottom, x, y)) {
          sfxType();
          state = "MENU";
        }
      } else if (state === "INFO") {
        if (hit(BTN.backBottom, x, y)) {
          sfxType();
          state = infoReturn;
        }
      } else if (state === "MISSIONS") {
        if (hit(BTN.backBottom, x, y)) {
          sfxType();
          state = "MENU";
        }
      } else if (state === "PLAYING") {
        if (hit(BTN.hudPause, x, y)) {
          if (ev) ev.preventDefault();
          triggerPause();
          return;
        }
        if (ev) ev.preventDefault();
        if (hit(BTN.tapCancel, x, y)) {
          cancelLockedWord();
          focusMobileKeyboard();
          return;
        }
        if (gameMode === "TYPERIA") {
          for (const sb of skillButtons) {
            if (hit(sb.rect, x, y)) {
              activateSkill(sb.key, nowTicks);
              focusMobileKeyboard();
              return;
            }
          }
        }
        focusMobileKeyboard();
      } else if (state === "PAUSED") {
        if (hit(BTN.pauseResume, x, y)) {
          if (ev) ev.preventDefault();
          resumeGame();
        } else if (hit(BTN.pauseInfo, x, y)) {
          sfxType();
          infoReturn = "PAUSED";
          state = "INFO";
        } else if (hit(BTN.pauseExit, x, y)) {
          sfxType();
          state = "MENU";
        }
      } else if (state === "GAMEOVER") {
        if (hit(BTN.retry, x, y)) {
          if (ev) ev.preventDefault();
          sfxCoin();
          startGame();
        } else if (hit(BTN.menu, x, y)) {
          sfxType();
          state = "MENU";
        }
      }
      syncInputOverlayPosition();
    }

        drawButton(BTN.med, "MEDIUM", difficulty === "MEDIUM" ? COLORS.QBLOCK_GOLD : COLORS.STONE_GRAY, "bold 15px 'Courier New'");
        drawButton(BTN.hard, "HARD", difficulty === "HARD" ? COLORS.MARIO_RED : COLORS.STONE_GRAY, "bold 15px 'Courier New'");

        drawTextOutline("2. WORD LANGUAGE", "bold 14px 'Courier New'", COLORS.TEXT_WHITE, WIDTH / 2, 308, 1, true);
        drawButton(BTN.langId, "INDONESIA", language === "INDONESIA" ? COLORS.PIPE_GREEN : COLORS.STONE_GRAY, "bold 14px 'Courier New'");
        drawButton(BTN.langEn, "ENGLISH", language === "ENGLISH" ? COLORS.QBLOCK_GOLD : COLORS.STONE_GRAY, "bold 14px 'Courier New'");
        drawButton(BTN.langPy, "PYTHON", language === "PYTHON" ? COLORS.INFO_BLUE : COLORS.STONE_GRAY, "bold 14px 'Courier New'");

        drawButton(BTN.modeClassic, "CLASSIC (5)", gameMode === "CLASSIC" ? COLORS.PIPE_GREEN : COLORS.STONE_GRAY, "bold 13px 'Courier New'");

        drawTextOutline(statStr, "bold 12px 'Courier New'", COLORS.TEXT_CYAN, WIDTH / 2, 124, 1, true);

        const vp = { x: 34, y: 150, w: WIDTH - 78, h: missionViewH };
        ctx.fillStyle = "#1c1c22";
        ctx.fillRect(vp.x, vp.y, vp.w, vp.h);

        ctx.save();
        ctx.beginPath();
        ctx.rect(vp.x, vp.y, vp.w, vp.h);
        ctx.clip();

        const compSet = new Set(progress.completed_missions || []);
        let my = vp.y + 8 - missionScrollY;
        for (const m of MISSIONS_DATA) {
          const isDone = compSet.has(m.id);
          const curV = progress[m.stat] || 0;
          drawRectBox(vp.x + 8, my, vp.w - 16, 56, isDone ? "#145f23" : "#2a2a30", isDone ? COLORS.TEXT_GREEN : COLORS.STONE_LIGHT, 2);
          drawTextOutline(m.title, "bold 13px 'Courier New'", COLORS.TEXT_WHITE, vp.x + 16, my + 8, 1);
          const tag = isDone ? "[DONE]" : `[${Math.min(curV, m.target)}/${m.target}]`;
          drawTextOutline(tag, "bold 12px 'Courier New'", isDone ? COLORS.TEXT_GREEN : COLORS.TEXT_GOLD, vp.x + vp.w - 86, my + 8, 1);
          drawTextOutline(`Reward: ${m.reward}`, "bold 12px 'Courier New'", isDone ? COLORS.TEXT_GOLD : COLORS.TEXT_CYAN, vp.x + 16, my + 30, 1);
          my += 64;
        }
        ctx.restore();

        const sbX = vp.x + vp.w + 6;
        ctx.fillStyle = "#18181c";
        ctx.fillRect(sbX, vp.y, 10, vp.h);
        if (maxMissionScroll > 0) {
          const thumbH = Math.max(36, vp.h * (vp.h / totalMissionH));
          const thumbY = vp.y + (vp.h - thumbH) * (missionScrollY / maxMissionScroll);
          ctx.fillStyle = COLORS.QBLOCK_GOLD;
          ctx.fillRect(sbX + 1, thumbY, 8, thumbH);
        }

        drawButton(BTN.backBottom, "BACK TO MENU", COLORS.QBLOCK_GOLD);
      } else if (state === "PLAYING" || state === "PAUSED") {
        const effectiveBottom = Math.max(340, visibleCanvasBottom);
        const uiStackHeight = gameMode === "TYPERIA" ? 152 : 92;
        activeDangerY = effectiveBottom - uiStackHeight;

        const isSlowed = gameMode === "TYPERIA" && nowTicks < f1SlowUntil;
        const speedScale = isSlowed ? 0.3 : 1.0;

        if (state === "PLAYING") {
          const settings = DIFFICULTY_SETTINGS[difficulty];
          const speedMult = Math.min(1.35, 1 + score / 7000);

          if (nowTicks >= nextSpawnTime && activeWords.length < settings.max_active) {
            const pInt = settings.phrase_every;
            const spawnPhrase = pInt !== null && wordsCleared >= nextPhraseMilestone && !activeWords.some((w) => w.isPhrase);
            if (spawnPhrase) {
              const pStr = CHALLENGE_PHRASES[language][Math.floor(Math.random() * CHALLENGE_PHRASES[language].length)];
              spawnWord(pStr, Math.max(0.85, settings.speed * 0.72), true);
              nextPhraseMilestone = wordsCleared + pInt + settings.phrase_words_bonus;
              sfxChallenge();
              nextSpawnTime = nowTicks + settings.spawn_rate / speedMult + 4600;
            } else {
              const wStr = pickBalancedWord(WORD_BANK[language][difficulty]);
              spawnWord(wStr, settings.speed * speedMult, false);
              nextSpawnTime = nowTicks + settings.spawn_rate / speedMult;
            }
          }

          for (let i = activeWords.length - 1; i >= 0; i--) {
            const w = activeWords[i];
            w.y += w.speed * speedScale;
            if (w.y + 34 >= activeDangerY) {
              if (w === lockedWord) {
                lockedWord = null;
                mistypedState = false;
              }
              activeWords.splice(i, 1);
              lives--;
              combo = 0;
              flashError = 8;
              sfxError();
              triggerRoast("hit", nowTicks, true);
            }
          }

          if (activeWords.length > 0) {
            const lowestY = Math.max(...activeWords.map((w) => w.y));
            if (lowestY >= activeDangerY - 85) triggerRoast("danger", nowTicks);
            else if (nowTicks - lastKeystrokeTicks > 3200) triggerRoast("slow", nowTicks);
          }

          for (let i = popups.length - 1; i >= 0; i--) {
            popups[i].y -= 1.2;
            popups[i].life--;
            if (popups[i].life <= 0) popups.splice(i, 1);
          }

          if (lives <= 0) {
            finalWpm = currentWpm;
            finalAccuracy = Math.round((totalCharsTyped / Math.max(totalKeystrokes, 1)) * 1000) / 10;
            if (totalCharsTyped >= 25) recordWpmProgress(finalWpm, nowTicks);
            saveHighscore(playerName || "PLAYER1", score, finalWpm, difficulty, language, gameMode);
            sfxGameOver();
            mobileInput.blur();
            state = "GAMEOVER";
          }
        }

        let thunderTargets = [];
        if (gameMode === "TYPERIA" && f3ThunderActive && lockedWord) {
          thunderTargets = getThunderTargets(lockedWord, 3);
          for (const tw of thunderTargets) {
            drawLightningArc(
              [lockedWord.x + lockedWord.width / 2, lockedWord.y + 14],
              [tw.x + tw.width / 2, tw.y + 14]
            );
          }
        }

        for (const w of activeWords) {
          const isLocked = w === lockedWord;
          const isTarget = thunderTargets.includes(w);
          const pad = w.isPhrase ? 10 : 9;
          const bh = w.isPhrase ? 38 : 34;

          let bg = COLORS.BRICK_ORANGE;
          let shine = COLORS.BRICK_LIGHT;
          let border = COLORS.BLACK;

          if (w.isPhrase) {
            bg = isLocked ? COLORS.QBLOCK_GOLD : COLORS.BOSS_PURPLE;
            shine = isLocked ? COLORS.QBLOCK_SHINE : COLORS.BOSS_SHINE;
          } else if (isLocked) {
            bg = COLORS.QBLOCK_GOLD;
            shine = COLORS.QBLOCK_SHINE;
          } else if (isTarget) {
            bg = "#b48c14";
            shine = COLORS.THUNDER_YELLOW;
            border = COLORS.THUNDER_YELLOW;
          } else if (isSlowed) {
            bg = "#1973af";
            shine = COLORS.ICE_CYAN;
            border = COLORS.ICE_CYAN;
          }

          drawRectBox(w.x - pad, w.y - 5, w.width + pad * 2, bh, bg, border, 3, shine);
          if (w.isPhrase) {
            drawTextOutline("BONUS PHRASE", "bold 11px 'Courier New'", COLORS.TEXT_GOLD, w.x + w.width / 2, w.y - 19, 1, true);
          }
          const tw = drawTextOutline(w.typed, w.font, COLORS.TEXT_GREEN, w.x, w.y, 2);
          drawTextOutline(w.text.slice(w.typed.length), w.font, COLORS.TEXT_WHITE, w.x + tw, w.y, 2);
        }

        for (const p of popups) {
          drawTextOutline(p.text, "bold 16px 'Courier New'", COLORS.THUNDER_YELLOW, p.x, p.y, 2, true);
        }

        ctx.fillStyle = "rgba(20, 22, 28, 0.92)";
        ctx.fillRect(0, activeDangerY, WIDTH, HEIGHT - activeDangerY);

        ctx.strokeStyle = COLORS.MARIO_RED;
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(0, activeDangerY);
        ctx.lineTo(WIDTH, activeDangerY);
        ctx.stroke();

        const lifeStr = gameMode === "INFINITE" ? "1-UP:♥" : `HP:${"♥".repeat(Math.max(0, lives))}`;
        drawTextOutline(lifeStr, "bold 16px 'Courier New'", COLORS.MARIO_RED, 16, activeDangerY + 8, 2);

        const activeBubble = nowTicks < roastUntil ? roastText : "";
        drawMrRoasting(WIDTH - 64, activeDangerY - 52, roastMood, activeBubble, nowTicks);

        const barY = activeDangerY + 32;
        BTN.tapKeyboard.y = barY;
        BTN.tapCancel.y = barY;
        drawRectBox(BTN.tapKeyboard.x, BTN.tapKeyboard.y, BTN.tapKeyboard.w, BTN.tapKeyboard.h, "#22252e", COLORS.TEXT_CYAN, 2);
        const promptTxt = lockedWord
          ? `TARGET: ${lockedWord.text}`
          : (isKeyboardOpen ? "KEYBOARD ACTIVE - TYPE NOW!" : "TAP HERE TO OPEN KEYBOARD");
        drawTextOutline(promptTxt, "bold 13px 'Courier New'", lockedWord ? COLORS.TEXT_GOLD : COLORS.TEXT_CYAN, BTN.tapKeyboard.x + BTN.tapKeyboard.w / 2, barY + 15, 1, true);
        drawButton(BTN.tapCancel, "CANCEL", COLORS.MARIO_RED, "bold 14px 'Courier New'");

        syncInputOverlayPosition();

        skillButtons = [];
        if (gameMode === "TYPERIA") {
          const skills = [
            { key: "F1", label: "SLOW", unlocked: unlockedSkills.F1, cd: f1CdUntil, col: COLORS.ICE_CYAN, active: isSlowed },
            { key: "F2", label: "PUSH", unlocked: unlockedSkills.F2, cd: f2CdUntil, col: COLORS.PIPE_LIGHT, active: false },
            { key: "F3", label: "THUNDER", unlocked: unlockedSkills.F3, cd: f3CdUntil, col: COLORS.THUNDER_YELLOW, active: f3ThunderActive },
            { key: "F4", label: "ADIOS", unlocked: unlockedSkills.F4, cd: f4CdUntil, col: COLORS.MARIO_RED, active: false }
          ];
          const sw = 106;
          const sh = 52;
          const gap = 8;
          const sx0 = (WIDTH - (sw * 4 + gap * 3)) / 2;
          const sy = barY + 50;

          skills.forEach((sk, i) => {
            const rect = { x: sx0 + i * (sw + gap), y: sy, w: sw, h: sh };
            skillButtons.push({ key: sk.key, rect });

            let bg = "#232328";
            let status = "LOCKED";
            let sCol = COLORS.MARIO_RED;
            let top = COLORS.STONE_DARK;

            if (sk.unlocked) {
              const rem = Math.max(0, (sk.cd - nowTicks) / 1000);
              if (sk.active) {
                bg = sk.col;
                status = "ACTIVE!";
                sCol = COLORS.BLACK;
                top = COLORS.QBLOCK_SHINE;
              } else if (rem > 0) {
                bg = COLORS.STONE_DARK;
                status = `${rem.toFixed(1)}s`;
                sCol = COLORS.TEXT_GOLD;
                top = COLORS.STONE_GRAY;
              } else {
                bg = COLORS.PIPE_GREEN;
                status = `TAP (${skillCooldownsMs[sk.key] / 1000}s)`;
                sCol = COLORS.TEXT_WHITE;
                top = COLORS.QBLOCK_SHINE;
              }
            }

            drawRectBox(rect.x, rect.y, rect.w, rect.h, bg, COLORS.BLACK, 2, top);
            drawTextOutline(sk.label, "bold 14px 'Courier New'", sk.unlocked ? COLORS.TEXT_WHITE : COLORS.STONE_LIGHT, rect.x + rect.w / 2, rect.y + 7, 1, true);
            drawTextOutline(status, "bold 11px 'Courier New'", sCol, rect.x + rect.w / 2, rect.y + 29, sCol === COLORS.BLACK ? 0 : 1, true);
          });
        }

        if (nowTicks < skillBannerUntil && skillBannerText) {
          drawTextOutline(skillBannerText, "bold 16px 'Courier New'", COLORS.THUNDER_YELLOW, WIDTH / 2, 66, 2, true);
        }

        if (state === "PAUSED") {
          ctx.fillStyle = "rgba(0, 0, 0, 0.65)";
          ctx.fillRect(0, 0, WIDTH, HEIGHT);
          drawStoneBox(45, 230, WIDTH - 90, 315);
          drawTextOutline("GAME PAUSED", "bold 24px 'Courier New'", COLORS.TEXT_GOLD, WIDTH / 2, 255, 2, true);
          drawButton(BTN.pauseResume, "RESUME", COLORS.PIPE_GREEN);
          drawButton(BTN.pauseInfo, "INFORMATION", COLORS.INFO_BLUE);
          drawButton(BTN.pauseExit, "EXIT TO MENU", COLORS.MARIO_RED);
        }
      } else if (state === "GAMEOVER") {
        drawTextOutline("GAME OVER", "bold 54px 'Courier New'", COLORS.MARIO_RED, WIDTH / 2, 130, 4, true);
        drawStoneBox(32, 225, WIDTH - 64, 285);

        const stats = [
          `PLAYER : ${playerName || "PLAYER1"}`,
          `MODE   : ${gameMode} (${language})`,
          `LEVEL  : ${difficulty} (${wordsCleared} WRD)`,
          `SCORE  : ${String(score).padStart(6, "0")}`,
          `SPEED  : ${finalWpm} WPM (${finalAccuracy}%)`
        ];
        stats.forEach((st, i) => {
          drawTextOutline(st, "bold 18px 'Courier New'", i === 3 ? COLORS.TEXT_GOLD : COLORS.TEXT_WHITE, 54, 252 + i * 48, 2);
        });

        drawButton(BTN.retry, "RETRY", COLORS.PIPE_GREEN);
        drawButton(BTN.menu, "MAIN MENU", COLORS.QBLOCK_GOLD);
      }

      requestAnimationFrame(gameLoop);
    }

    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
